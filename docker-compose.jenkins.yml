version: '3.8'
services:
  jenkins:
    build:
      context: .
      dockerfile: Jenkins.Dockerfile
    container_name: jenkins_server
    user: root # Windows Docker Desktop soketine erişim için yetki veriyoruz
    ports:
      - "8081:8080" # Kendi API'miz 8080'de olduğu için Jenkins'i 8081'e alıyoruz
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock # Jenkins'in, bilgisayarındaki Docker'ı yönetebilmesi için .

volumes:
  jenkins_home: